<style>
  :root {
    --al-2xx: #2f9e5f; --al-3xx: #3b7dd8; --al-4xx: #d48a14; --al-5xx: #d0453a;
    --al-track: rgba(127, 127, 127, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --al-2xx: #4cc283; --al-3xx: #6aa3f0; --al-4xx: #f0aa3c; --al-5xx: #f06b5f; }
  }
  :root[data-theme="dark"] { --al-2xx: #4cc283; --al-3xx: #6aa3f0; --al-4xx: #f0aa3c; --al-5xx: #f06b5f; }

  .al-2xx { --c: var(--al-2xx); } .al-3xx { --c: var(--al-3xx); }
  .al-4xx { --c: var(--al-4xx); } .al-5xx { --c: var(--al-5xx); }
  .al-5xx-text { color: var(--al-5xx); }

  .al-range { margin: 0 0 12px; color: var(--body-quiet-color); }
  .al-tz { font-size: 0.85em; }
  .al-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .al-card { border: 1px solid var(--hairline-color); border-radius: 6px; padding: 12px 14px; background: var(--body-bg); display: flex; flex-direction: column; gap: 2px; }
  .al-card-label { font-size: 0.8rem; color: var(--body-quiet-color); text-transform: uppercase; letter-spacing: 0.03em; }
  .al-card-value { font-size: 1.7rem; font-weight: 600; color: var(--body-fg); font-variant-numeric: tabular-nums; }
  .al-card-value small { font-size: 0.9rem; font-weight: 400; color: var(--body-quiet-color); }
  .al-card-sub { font-size: 0.8rem; color: var(--body-quiet-color); }

  .al-panels { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 1024px) { .al-panels { grid-template-columns: minmax(0, 1fr); } }
  .al-panel { margin: 0; border: 1px solid var(--hairline-color); border-radius: 6px; padding-bottom: 10px; }
  .al-panel h2 { border-radius: 6px 6px 0 0; }

  .al-chart { display: flex; gap: 8px; padding: 14px 14px 0; height: 190px; }
  .al-yaxis { display: flex; flex-direction: column; justify-content: space-between; font-size: 0.75rem; color: var(--body-quiet-color); padding-bottom: 20px; text-align: right; min-width: 2.5em; font-variant-numeric: tabular-nums; }
  .al-bars { flex: 1; min-width: 0; display: flex; align-items: stretch; gap: 6px; border-left: 1px solid var(--hairline-color); padding-left: 6px; }
  .al-bars-dense { gap: 2px; }
  .al-col { flex: 1; display: flex; flex-direction: column; min-width: 0; max-width: 64px; }
  .al-bar-area { flex: 1; display: flex; align-items: flex-end; border-bottom: 1px solid var(--hairline-color); }
  .al-bar { width: 100%; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; min-height: 0; }
  .al-seg { background: var(--c); width: 100%; }
  .al-col:hover .al-seg { filter: brightness(1.12); }
  .al-xlabel { height: 20px; line-height: 20px; font-size: 0.72rem; color: var(--body-quiet-color); text-align: center; white-space: nowrap; }
  .al-bars-dense .al-xlabel { overflow: visible; display: flex; justify-content: center; }
  .al-legend { display: flex; gap: 14px; padding: 8px 14px 0; font-size: 0.8rem; color: var(--body-quiet-color); }
  .al-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

  .al-breakdown { width: 100%; border: none; margin-top: 6px; }
  .al-breakdown th, .al-breakdown td { border: none; padding: 5px 12px; vertical-align: middle; background: transparent; }
  .al-breakdown th { width: 1%; }
  .al-track { width: 100%; }
  .al-fill { height: 10px; border-radius: 5px; background: var(--c); min-width: 2px; }
  .al-num { text-align: right; font-variant-numeric: tabular-nums; }
  .al-nowrap { white-space: nowrap; }

  .al-badge { display: inline-block; min-width: 2.6em; text-align: center; padding: 1px 7px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); font-variant-numeric: tabular-nums; }
  a.al-badge:hover { text-decoration: none; background: color-mix(in srgb, var(--c) 24%, transparent); }
  #changelist .results { overflow-x: auto; }
  .al-api { word-break: break-all; }
  .al-empty { color: var(--body-quiet-color); padding: 12px; }
  .al-count { float: right; color: var(--body-quiet-color); font-size: 0.85em; }
  .al-pager a { margin-right: 14px; }

  .al-detail th { width: 160px; white-space: nowrap; }
  .al-pre { white-space: pre-wrap; word-break: break-word; max-height: 480px; overflow: auto; margin: 0; padding: 10px; background: var(--darkened-bg); border-radius: 4px; font-size: 0.8rem; }
</style>
